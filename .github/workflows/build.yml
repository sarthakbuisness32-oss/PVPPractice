
name: Build PvPPractice

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

            - name: Build plugin
        run: mvn --batch-mode -f PvPPractice-Project/PvPPractice/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PvPPractice-JAR
          path: PvPPractice-Project/PvPPractice/target/*.jar
          if-no-files-found: error
